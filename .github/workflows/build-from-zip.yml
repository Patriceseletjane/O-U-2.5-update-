name: Build APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          mkdir -p /tmp/project
          unzip -o "$ZIP" -d /tmp/project
          if [ -d /tmp/project/Over-2.5-Pro-Final-Boss-v4 ]; then
            cp -a /tmp/project/Over-2.5-Pro-Final-Boss-v4/. .
          else
            cp -a /tmp/project/. .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Over-2.5-Pro-Final-Boss-v4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
